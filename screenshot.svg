<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="8" y="8" width="804" height="274" rx="18" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="1.5"/>
  <text x="40" y="44" font-size="15" font-weight="700" letter-spacing="0.12em" fill="#2C4A6E">STEPPED</text>
  <text x="40" y="66" font-size="13.5" fill="#6B7B7B">Long quotes, sentence by sentence — focus mode keeps the whole text readable.</text>

  <!-- one sentence per line: past and future dimmed, the current one awake -->
  <g font-size="19">
    <text x="40" y="108" fill="#0B1818" opacity="0.3"><tspan font-size="11.5" font-weight="700" fill="#2C4A6E" dy="-7">1</tspan><tspan dy="7"> The skin is the largest organ of the human body.</tspan></text>

    <rect x="34" y="123" width="452" height="29" rx="3" fill="#D9930A" fill-opacity="0.28"/>
    <text x="40" y="143" fill="#2C4A6E"><tspan font-size="11.5" font-weight="700" dy="-7" opacity="0.55">2</tspan><tspan dy="7" textLength="425" lengthAdjust="spacing"> It protects against water loss and pathogens.</tspan></text>

    <text x="40" y="178" fill="#0B1818" opacity="0.3"><tspan font-size="11.5" font-weight="700" fill="#2C4A6E" dy="-7">3</tspan><tspan dy="7"> With age, sebum production declines.</tspan></text>
    <text x="40" y="213" fill="#0B1818" opacity="0.3"><tspan font-size="11.5" font-weight="700" fill="#2C4A6E" dy="-7">4</tspan><tspan dy="7"> The skin dries out, which raises the risk of pressure injury.</tspan></text>
  </g>

  <line x1="40" y1="236" x2="780" y2="236" stroke="#E7EBEF" stroke-width="1.5"/>
  <g font-size="12.5" fill="#6B7B7B">
    <text x="40" y="262">build — one after another</text>
    <text x="240" y="262">focus — context stays</text>
    <text x="420" y="262">numbered — “look at sentence 2”</text>
    <text x="660" y="262">splits by itself</text>
  </g>
</svg>
